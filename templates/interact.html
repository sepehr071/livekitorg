<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Agent - AYAND</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/interact.css') }}">
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.3.0/dist/dotlottie-wc.js" type="module"></script>
</head>
<body>
    <div class="interact-page">
        <div class="container">
            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="flash-messages">
                        {% for category, message in messages %}
                            <div class="flash-message {{ category if category != 'message' else 'info' }}">
                                {{ message }}
                                <button type="button" class="flash-close" onclick="this.parentElement.style.display='none';">&times;</button>
                            </div>
                        {% endfor %}
                    </div>
                {% endif %}
            {% endwith %}
            
            <div class="glass-card">
                <div class="connection-status-bar">
                    <div class="logo-container">
                        <img src="{{ url_for('static', filename='assets/logo.svg') }}" alt="Carema Logo" class="logo">
                    </div>
                    <div class="header-controls">
                        <div class="language-dropdown">
                            <button class="lang-btn" id="lang-btn" title="Change Language">
                                <i class="fas fa-globe"></i>
                                <span class="current-lang">EN</span>
                            </button>
                            <div class="dropdown-content" id="lang-dropdown">
                                <a href="#" data-lang="de">German</a>
                                <a href="#" data-lang="nl" class="disabled">Dutch</a>
                                <a href="#" data-lang="pl" class="disabled">Polish</a>
                                <a href="#" data-lang="it" class="disabled">Italian</a>
                                <a href="#" data-lang="fr" class="disabled">French</a>
                                <a href="#" data-lang="en" class="disabled">English</a>
                                <a href="#" data-lang="es" class="disabled">Spanish</a>
                            </div>
                        </div>
                        <a href="/logout" class="logout-btn" title="Logout">
                            <i class="fas fa-sign-out-alt"></i>
                        </a>
                    </div>
                </div>
                
                <div class="glass-card-content">
                    <!-- AI response in the middle -->
                    <div class="ai-response-container" id="conversation-container">
                        <!-- AI responses will be added here dynamically -->
                    </div>
                    
                    <!-- Hidden original chat container kept for compatibility -->
                    <div id="chat-container" class="chat-container" style="display: none;">
                        <!-- Original messages will be stored here but not displayed -->
                    </div>
                    
                    <div class="voice-button-container">
                        <button id="mic-button" class="voice-button">
                            <!-- Default disconnected state icon -->
                            <i class="fas fa-arrow-right" id="mic-icon-connect"></i>
                            <!-- Connected/muted state icon (initially hidden) -->
                            <i class="fas fa-microphone" id="mic-icon-mute" style="display: none;"></i>
                            <!-- Active/listening state icon (initially hidden) -->
                            <i class="fas fa-microphone-alt" id="mic-icon-active" style="display: none;"></i>
                            <div class="voice-waves">
                                <span></span>
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                            <div class="listening-indicator">
                                <span></span>
                                <span></span>
                                <span></span>
                            </div>
                        </button>
                        <div class="voice-status">
                            <span id="mic-status">Start</span>
                        </div>
                    </div>
                    
                    <div class="text-input-container">
                        <input type="text" id="text-input" class="text-input" placeholder="Type your message here...">
                        <button id="send-button" class="send-button">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden elements for functionality -->
    <div style="display: none;">
        <button id="connect-button">Connect</button>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- First load the LiveKit client library for global access -->
    <script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>
    <script>
        // Make LiveKit available globally
        window.LivekitClient = LivekitClient;
        console.log('LiveKit client loaded:', window.LivekitClient ? 'Yes' : 'No');
    </script>
    
    <!-- Then load our bundled JS which uses the global LiveKit client -->
    <script src="{{ url_for('static', filename='js/interact.js') }}"></script>
</body>
</html>
